name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    # GITHUB_TOKEN mặc định chỉ đọc (repo mới) → tạo GitHub Release báo 403
    # "Resource not accessible by integration". Cần quyền ghi contents.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Build (Release)
        run: dotnet build CadCoreFramework.sln -c Release -v minimal

      - name: Test
        run: >
          dotnet test CadCoreFramework.Tests/CadCoreFramework.Tests.csproj
          -c Release --no-build --logger "console;verbosity=normal"

      # Tag v1.2.0 → package.ps1 -Version 1.2.0 → dist/CadCoreFramework_v1.2.0_Setup.zip
      # (đóng dấu version vào PackageContents.xml). package.ps1 tự nén — KHÔNG nén lại dist\*,
      # vì như vậy zip phát hành sẽ chứa cả thư mục staging lẫn zip của package.ps1.
      - name: Package bundle
        id: package
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\package.ps1 -Version $version
          "zip=dist/CadCoreFramework_v${version}_Setup.zip" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ github.ref_name }}
          path: ${{ steps.package.outputs.zip }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true
