name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dotnet tools (ReportGenerator)
        run: dotnet tool restore

      # -warnaserror: the solution builds with 0 warnings — keep it that way.
      # A new warning (unused using, malformed XML doc, obsolete API, CAD001…) fails CI.
      - name: Build (Release, warnings as errors)
        run: dotnet build CadCoreFramework.sln -c Release -v minimal -warnaserror

      # Runs the suite twice: net48 (AutoCAD 2021–2024) and net8.0-windows (AutoCAD 2025+).
      # LogFilePrefix (not LogFileName) so the two TFMs don't overwrite each other's .trx.
      - name: Test with coverage (net48 + net8.0-windows)
        run: >
          dotnet test CadCoreFramework.Tests/CadCoreFramework.Tests.csproj
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory coverage
          --logger "trx;LogFilePrefix=test-results"
          --logger "console;verbosity=normal"

      - name: Generate coverage report
        run: >
          dotnet reportgenerator
          -reports:"coverage/**/coverage.cobertura.xml"
          -targetdir:"coverage/report"
          -reporttypes:"Html;Cobertura"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/report

  # Kiểm tài liệu: link/anchor, thẻ ⏱ + nhãn 🎯/🔍/📖, sơ đồ mermaid, code mẫu C# (docs/training/README.md §7).
  # Không cần .NET; Linux phân biệt hoa/thường như GitHub nên bắt được link sai chữ hoa.
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/docs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/docs/package-lock.json

      - name: Install (versions pinned in package-lock.json)
        run: npm ci

      # !cancelled(): một bước đỏ vẫn chạy các bước sau, để thấy hết lỗi trong một lần.
      - name: Links and anchors
        run: npm run links

      - name: Reading time and section tags
        if: ${{ !cancelled() }}
        run: npm run reading-time

      - name: Mermaid diagrams
        if: ${{ !cancelled() }}
        run: npm run mermaid

      # Code mẫu C01–C05, U01: biên dịch C# 10 / net8.0, chạy, so output (chú thích <!-- doc-check: … -->).
      - name: Setup .NET (code samples)
        if: ${{ !cancelled() }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Code samples
        if: ${{ !cancelled() }}
        run: npm run snippets
